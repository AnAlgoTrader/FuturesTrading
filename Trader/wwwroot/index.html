<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trader</title>
    <link rel="stylesheet" href="assets/css/main.css"/>
</head>
<body>
<div class="layout">
    <header class="layout-top">
        <div class="stats">
            <div class="stat">
                <span class="stat-label">Updated On</span>
                <span class="stat-value">Mon 13 Jan</span>
            </div>
            <div class="stat">
                <span class="stat-label">Funds</span>
                <span class="stat-value">12480</span>
            </div>
            <div class="stat">
                <span class="stat-label">Buying Power</span>
                <span class="stat-value">146790</span>
            </div>
            <div class="stat">
                <span class="stat-label">Eur</span>
                <span class="stat-value">32560</span>
            </div>
            <div class="stat">
                <span class="stat-label">Usd</span>
                <span class="stat-value">123</span>
            </div>
            <div class="stat">
                <span class="stat-label">Expiration</span>
                <span class="stat-value">Tue 14 Jan</span>
            </div>
        </div>
    </header>
    <main class="layout-main"></main>
</div>

<script src="app://dynamic.js"></script>
<script type="application/javascript" src="assets/js/main.js"></script>
<script>    
    window.external.receiveMessage(message => receiveFromBackground(message));
    callBackground('applicationReady');
</script>
</body>
</html>
