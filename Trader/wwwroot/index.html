<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trader</title>
    <link rel="stylesheet" href="assets/css/main.css"/>
</head>
<body>
<div class="layout">
    <header class="layout-top">
        <div class="stats">
            <div class="stat">
                <span class="stat-label">Updated On</span>
                <span class="stat-value" id="stat-updated-on">-</span>
            </div>
            <div class="stat">
                <span class="stat-label">Funds</span>
                <span class="stat-value" id="stat-funds">-</span>
            </div>
            <div class="stat">
                <span class="stat-label">Buying Power</span>
                <span class="stat-value" id="stat-buying-power">-</span>
            </div>
            <div class="stat">
                <span class="stat-label">Eur</span>
                <span class="stat-value" id="stat-eur">-</span>
            </div>
            <div class="stat">
                <span class="stat-label">Usd</span>
                <span class="stat-value" id="stat-usd">-</span>
            </div>
        </div>
        <div class="actions">
            <button class="action action-buy" id="btn-buy" onclick="callBackground('buy')">Buy</button>
            <button class="action action-sell" id="btn-sell" onclick="callBackground('sell')">Sell</button>
        </div>
    </header>
    <main class="layout-main">
        <div id="chart">
            <button id="close-btn" title="Close Position"><img src="assets/img/close.png" alt="×"></button>
        </div>
    </main>
</div>

<script src="app://dynamic.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/lightweight-charts.standalone.production.js"></script>
<script src="assets/js/chartHelper.js"></script>
<script>    
    window.external.receiveMessage(message => receiveFromBackground(message));
    callBackground('applicationReady');
</script>
</body>
</html>
