<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ES Chart</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #131722;
            overflow: hidden;
        }

        #chart {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #status {
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 10;
            color: #d1d4dc;
            font: 14px monospace;
        }

        #tooltip {
            position: absolute;
            display: none;
            padding: 8px 12px;
            box-sizing: border-box;
            z-index: 1000;
            pointer-events: none;
            border-radius: 4px;
            background: #1e222d;
            border: 1px solid #2a2e39;
            font-family: -apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, Ubuntu, sans-serif;
            max-width: 320px;
        }

        #tooltip .signal-name {
            color: #d1d4dc;
            font: 600 13px/1.4 sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #tooltip .signal-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        #tooltip .signal-desc {
            color: #787b86;
            font: 12px/1.4 sans-serif;
            margin-top: 4px;
        }
    </style>
</head>
<body>
<div id="chart">
    <div id="tooltip">
        <div class="signal-name"><span class="signal-dot"></span><span class="signal-text"></span></div>
        <div class="signal-desc"></div>
    </div>
</div>
<div id="status">Loading chart...</div>
<script src="js/lightweight-charts.standalone.production.js"></script>
<script>
(function () {
    var status = document.getElementById('status');
    var toolTip = document.getElementById('tooltip');
    var tooltipDot = toolTip.querySelector('.signal-dot');
    var tooltipText = toolTip.querySelector('.signal-text');
    var tooltipDesc = toolTip.querySelector('.signal-desc');

    var activePriceLine = null;

    var SIGNAL_INFO = {
        '#787b86': { name: 'Normal', desc: 'Volume and spread are within normal ranges \u2014 no anomaly detected' },
        '#26a69a': { name: 'Climax Up', desc: 'High volume with wide upward spread \u2014 indicates aggressive buying that may signal a buying climax or blow-off top' },
        '#ef5350': { name: 'Climax Down', desc: 'High volume with wide downward spread \u2014 indicates panic selling that may signal a selling climax or capitulation low' },
        '#ff9800': { name: 'Churn', desc: 'High volume with narrow spread \u2014 indicates heavy turnover with minimal price progress, signaling accumulation or distribution' },
        '#fdd835': { name: 'Low Volume', desc: 'Lowest volume in lookback window \u2014 indicates low market participation, often preceding a breakout or volatility expansion' },
        '#ab47bc': { name: 'Absorption', desc: 'High volume with strong delta and narrow spread \u2014 indicates passive limit orders are absorbing aggressive market orders' },
        '#00b0ff': { name: 'Stacked Imbalance', desc: 'Multiple consecutive bars with one-sided delta \u2014 indicates sustained directional order flow pressure' }
    };

    function fail(message) {
        status.style.color = '#ef5350';
        status.textContent = message;
    }

    window.onerror = function (message, source, line, column) {
        fail('JS ERROR: ' + message + ' (' + (source || '?') + ':' + line + ':' + column + ')');
    };

    if (typeof LightweightCharts === 'undefined') {
        fail('FAILED: lightweight-charts script did not load.');
        return;
    }

    try {
        var container = document.getElementById('chart');

        var MIN_PRICE_SPAN = 8;
        var RIGHT_MARGIN_BARS = 15;

        var chart = LightweightCharts.createChart(container, {
            width: container.clientWidth || 800,
            height: container.clientHeight || 600,
            layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
                vertLine: { visible: false, labelVisible: false },
                horzLine: { visible: false, labelVisible: false }
            },
            rightPriceScale: { borderColor: '#2a2e39' },
            timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: false }
        });

        window.addEventListener('resize', function () {
            chart.resize(container.clientWidth, container.clientHeight);
        });

        var series = chart.addSeries(LightweightCharts.CandlestickSeries, {
            upColor: '#26a69a',
            downColor: '#ef5350',
            borderVisible: false,
            wickUpColor: '#26a69a',
            wickDownColor: '#ef5350',
            autoscaleInfoProvider: function (original) {
                var info = original();
                if (info && info.priceRange) {
                    var min = info.priceRange.minValue;
                    var max = info.priceRange.maxValue;
                    if (max - min < MIN_PRICE_SPAN) {
                        var mid = (min + max) / 2;
                        info.priceRange = {
                            minValue: mid - MIN_PRICE_SPAN / 2,
                            maxValue: mid + MIN_PRICE_SPAN / 2
                        };
                    }
                }
                return info;
            }
        });

        var hasData = false;

        window.pushCandle = function (time, open, high, low, close, color) {
            series.update({ time: time, open: open, high: high, low: low, close: close, color: color });
            if (!hasData) {
                hasData = true;
                chart.timeScale().setVisibleLogicalRange({
                    from: -(60 - RIGHT_MARGIN_BARS),
                    to: RIGHT_MARGIN_BARS
                });
            }
        };

        window.setOrderLine = function (price, color, title) {
            if (!price || price <= 0) {
                if (activePriceLine) {
                    try {
                        series.removePriceLine(activePriceLine);
                    } catch (e) {}
                    activePriceLine = null;
                }
                return;
            }

            var lineOptions = {
                price: price,
                color: color || '#26a69a',
                lineWidth: 2,
                lineStyle: LightweightCharts.LineStyle.Dashed,
                axisLabelVisible: true,
                title: title || ''
            };

            if (!activePriceLine) {
                activePriceLine = series.createPriceLine(lineOptions);
            } else {
                activePriceLine.applyOptions(lineOptions);
            }
        };

        chart.subscribeCrosshairMove(function (param) {
            if (!param || param.point === undefined || !param.time ||
                param.point.x < 0 || param.point.x > container.clientWidth ||
                param.point.y < 0 || param.point.y > container.clientHeight) {
                toolTip.style.display = 'none';
                return;
            }

            var data = param.seriesData.get(series);
            if (!data || !data.color) {
                toolTip.style.display = 'none';
                return;
            }

            var info = SIGNAL_INFO[data.color];
            if (!info) {
                toolTip.style.display = 'none';
                return;
            }

            tooltipDot.style.backgroundColor = data.color;
            tooltipText.textContent = info.name;
            tooltipDesc.textContent = info.desc;
            toolTip.style.display = 'block';
            toolTip.style.left = param.point.x + 'px';
            toolTip.style.top = param.point.y + 'px';
        });

        status.style.display = 'none';
    } catch (err) {
        fail('CHART ERROR: ' + (err && err.message ? err.message : err));
    }
})();
</script>
</body>
</html>
