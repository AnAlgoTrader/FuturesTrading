<!DOCTYPE html>
<html lang="en">
<head>
    <title>Trader</title>
    <script>
        window.onerror = function (msg, src, line, col) {
            var body = 'jsError: ' + msg + ' @ ' + src + ':' + line + ':' + col;
            try {
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(body);
                } else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.postAvWebViewMessage) {
                    window.webkit.messageHandlers.postAvWebViewMessage.postMessage(body);
                }
            } catch (e) { }
        };
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #131722;
            overflow: hidden;
        }

        #app {
            display: flex;
            width: 100%;
            height: 100%;
        }

        #chart {
            width: 100%;
            height: 100%;
            position: relative;
            flex: 1;
        }

        #close-btn {
            position: absolute;
            right: 65px;
            transform: translateY(-50%);
            display: none;
            width: 20px;
            height: 20px;
            padding: 0;
            border-radius: 50%;
            background: #ef5350;
            border: 1px solid rgba(255, 255, 255, 0.7);
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s, background 0.15s;
        }

        #close-btn img {
            width: 12px;
            height: 12px;
            display: block;
        }

        #close-btn:hover {
            background: #f44336;
            transform: translateY(-50%) scale(1.15);
        }

        #close-btn:active {
            transform: translateY(-50%) scale(0.9);
        }
    </style>
</head>
<body>
<div id="app">
    <div id="chart">
        <button id="close-btn" title="Close Position"><img src="img/close.png" alt="×"></button>
    </div>
</div>
<script src="js/lightweight-charts.standalone.production.js"></script>
<script src="js/chartHelper.js"></script>
</body>
</html>
