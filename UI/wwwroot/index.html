<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MES Chart</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #131722;
            overflow: hidden;
        }

        #chart {
            width: 100%;
            height: 100%;
        }

        #status {
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 10;
            color: #d1d4dc;
            font: 14px monospace;
        }
    </style>
</head>
<body>
<div id="chart"></div>
<div id="status">Loading chart...</div>
<script src="js/lightweight-charts.standalone.production.js"></script>
<script>
(function () {
    var status = document.getElementById('status');

    function fail(message) {
        status.style.color = '#ef5350';
        status.textContent = message;
    }

    window.onerror = function (message, source, line, column) {
        fail('JS ERROR: ' + message + ' (' + (source || '?') + ':' + line + ':' + column + ')');
    };

    if (typeof LightweightCharts === 'undefined') {
        fail('FAILED: lightweight-charts script did not load.');
        return;
    }

    try {
        var container = document.getElementById('chart');

        var MIN_PRICE_SPAN = 8;   // points; keeps the y-axis from zooming into a few ticks
        var RIGHT_MARGIN_BARS = 15;

        var chart = LightweightCharts.createChart(container, {
            width: container.clientWidth || 800,
            height: container.clientHeight || 600,
            layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Hidden },
            rightPriceScale: { borderColor: '#2a2e39' },
            timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: false }
        });

        window.addEventListener('resize', function () {
            chart.resize(container.clientWidth, container.clientHeight);
        });

        var series = chart.addSeries(LightweightCharts.CandlestickSeries, {
            upColor: '#26a69a',
            downColor: '#ef5350',
            borderVisible: false,
            wickUpColor: '#26a69a',
            wickDownColor: '#ef5350',
            autoscaleInfoProvider: function (original) {
                var info = original();
                if (info && info.priceRange) {
                    var min = info.priceRange.minValue;
                    var max = info.priceRange.maxValue;
                    if (max - min < MIN_PRICE_SPAN) {
                        var mid = (min + max) / 2;
                        info.priceRange = {
                            minValue: mid - MIN_PRICE_SPAN / 2,
                            maxValue: mid + MIN_PRICE_SPAN / 2
                        };
                    }
                }
                return info;
            }
        });

        var hasData = false;
        var knownTimes = {};
        var tradeMarkers = LightweightCharts.createSeriesMarkers(series, []);
        var tradeLine = null;
        var pendingMarker = null;

        function removeTradeLine() {
            if (tradeLine) {
                series.removePriceLine(tradeLine);
                tradeLine = null;
            }
        }

        window.pushCandle = function (time, open, high, low, close) {
            series.update({ time: time, open: open, high: high, low: low, close: close });
            knownTimes[time] = true;
            if (pendingMarker && knownTimes[pendingMarker.time]) {
                tradeMarkers.setMarkers([pendingMarker]);
                pendingMarker = null;
            }
            if (!hasData) {
                hasData = true;
                chart.timeScale().setVisibleLogicalRange({
                    from: -(60 - RIGHT_MARGIN_BARS),
                    to: RIGHT_MARGIN_BARS
                });
            }
        };

        window.updateTrade = function (s) {
            if (!s || !s.hasTrade) {
                tradeMarkers.setMarkers([]);
                removeTradeLine();
                return;
            }

            var marker = {
                time: s.entryTime,
                position: s.dir === 'LONG' ? 'belowBar' : 'aboveBar',
                shape: s.dir === 'LONG' ? 'arrowUp' : 'arrowDown',
                color: s.dir === 'LONG' ? '#26a69a' : '#ef5350',
                text: (s.dir === 'LONG' ? 'L ' : 'S ') + s.entry.toFixed(2)
            };
            if (knownTimes[s.entryTime]) {
                pendingMarker = null;
                tradeMarkers.setMarkers([marker]);
            } else {
                pendingMarker = marker;
            }

            if (!tradeLine) {
                tradeLine = series.createPriceLine({
                    price: s.stop,
                    color: '#f0b90b',
                    lineWidth: 1,
                    lineStyle: LightweightCharts.LineStyle.Dashed,
                    axisLabelVisible: true,
                    title: 'stop'
                });
            } else {
                tradeLine.applyOptions({ price: s.stop });
            }
        };

        status.style.display = 'none';
    } catch (err) {
        fail('CHART ERROR: ' + (err && err.message ? err.message : err));
    }
})();
</script>
</body>
</html>
