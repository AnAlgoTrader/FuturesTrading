<!DOCTYPE html>
<html lang="en">
<head>
    <title>QQQ Trader</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #131722;
            overflow: hidden;
        }

        #chart {
            width: 100%;
            height: 100%;
            position: relative;
        }
    </style>
</head>
<body>
<div id="message">Waiting for message</div>
<script src="js/lightweight-charts.standalone.production.js"></script>
<script>
    (function () {
        window.notifyUI = function (message) {
            document.getElementById('message').textContent = message;
        }
    })();
</script>
</body>
</html>
