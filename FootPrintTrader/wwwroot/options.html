<!DOCTYPE html>
<html lang="en">
<head>
    <!--
        Options window.
        Renders the Cboe SPXW chain pushed by Program.FetchOptionsChainAsync.
        Hosted by Program.OpenOptionsWindow through Photino at wwwroot/options.html.
    -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options Trader</title>
    <link rel="stylesheet" href="assets/options.css" />
</head>
<body>

<div id="options-layout">
    <header class="options-header">
        <div class="title-block">
            <div class="title">SPXW OPTIONS CHAIN</div>
            <div class="subtitle">
                <span id="opt-symbol">-</span> &bull; <span id="opt-expiry">-</span>
            </div>
        </div>

        <!-- Staged Credit Spread Table -->
        <div class="spread-panel" id="spread-panel">
            <table class="spread-table" id="spread-table">
                <thead>
                    <tr>
                        <th class="col-strategy">Strategy</th>
                        <th class="col-leg">Short Leg (Sell)</th>
                        <th class="col-price">Short Bid</th>
                        <th class="col-price">Short Ask</th>
                        <th class="col-leg">Long Leg (Buy)</th>
                        <th class="col-price">Long Bid</th>
                        <th class="col-price">Long Ask</th>
                        <th class="col-credit">Net Credit</th>
                        <th class="col-risk">Max Risk</th>
                        <th class="col-action">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr id="spread-row" class="empty">
                        <td class="col-strategy" id="sp-strategy"><span class="spread-badge badge-empty">NO SPREAD</span></td>
                        <td class="col-leg" id="sp-short-leg"><span class="dim">-</span></td>
                        <td class="col-price" id="sp-short-bid"><span class="dim">-</span></td>
                        <td class="col-price" id="sp-short-ask"><span class="dim">-</span></td>
                        <td class="col-leg" id="sp-long-leg"><span class="dim">-</span></td>
                        <td class="col-price" id="sp-long-bid"><span class="dim">-</span></td>
                        <td class="col-price" id="sp-long-ask"><span class="dim">-</span></td>
                        <td class="col-credit" id="sp-net-credit"><span class="dim">-</span></td>
                        <td class="col-risk" id="sp-max-risk"><span class="dim">-</span></td>
                        <td class="col-action" id="sp-action">
                            <button type="button" class="btn-spread-trade" id="btn-spread-trade" disabled title="Trade Spread (Next phase)">TRADE</button>
                            <button type="button" class="btn-spread-clear" id="btn-spread-clear" onclick="clearSpread()" disabled title="Clear staged spread">&times;</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="header-metrics">
            <div class="header-metric">
                <span class="header-label">Spot</span>
                <span class="header-value" id="opt-spot">-</span>
            </div>
            <div class="header-metric">
                <span class="header-label">Updated</span>
                <span class="header-value" id="opt-updated">-</span>
            </div>
            <div class="live-tag">
                <span class="live-dot"></span>LIVE
            </div>
        </div>
    </header>

    <main id="table-wrap">
        <table id="chain-table">
            <thead>
                <tr class="column-row">
                    <th>Bid</th>
                    <th>Ask</th>
                    <th>IV</th>
                    <th>&Delta;</th>
                    <th>&Gamma;</th>
                    <th>OI</th>
                    <th class="strike-col">Strike</th>
                    <th class="gex-col" title="Gamma exposure per 1% move: (call γ × call OI − put γ × put OI) × 100 × spot² × 0.01">GEX</th>
                    <th>Bid</th>
                    <th>Ask</th>
                    <th>IV</th>
                    <th>&Delta;</th>
                    <th>&Gamma;</th>
                    <th>OI</th>
                    <th class="trade-col">Trade</th>
                </tr>
            </thead>
            <tbody id="chain-body"></tbody>
        </table>
        <div id="empty-state">Waiting for Cboe chain&hellip;</div>
    </main>

    <footer class="status-bar">
        <span id="status-text">Connecting&hellip;</span>
        <span id="status-count"></span>
    </footer>
</div>

<script src="app://dynamic.js"></script>
<script src="assets/js/options.js"></script>
<script>
    window.external.receiveMessage(message => receiveFromBackground(message));
    window.external.sendMessage('optionsReady');
</script>
</body>
</html>
